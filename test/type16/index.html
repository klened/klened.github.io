  function finish(){
    var code="", tags=[];
    for(var ax=0;ax<4;ax++){ var pole=(cnt[ax][1]>cnt[ax][0])?1:0; var L=AXES[ax][pole]; code+=L; tags.push(POLE[L]); }
    var t=T[code]; current={code:code,t:t};
    $("rcard").style.background = code.charAt(0)==="S" ? "linear-gradient(135deg,#3182f6,#1b64da)" : "linear-gradient(135deg,#f368a8,#e84393)";
    $("rEmoji").textContent=t.e;
    $("rCode").textContent=code;
    $("rName").textContent=t.n;
    $("rSub").textContent=t.s;
    $("rHook").textContent=t.hook;
    var c0=code.charAt(0),c1=code.charAt(1),c2=code.charAt(2),c3=code.charAt(3);
    var paras=[AX[c0]+" "+AX[c1], AX[c2]+" "+AX[c3], "이 네 가지 색이 모여, 당신은 '"+t.n+"' — "+t.s+"가 되는 거예요."];
    $("rPortrait").innerHTML=paras.map(function(x){return "<p>"+x+"</p>";}).join("");
    $("rFin").textContent=FIN[c0+c2]||"";
    $("rClose").textContent=t.close||"";
    $("rBlind").innerHTML=(t.blind||[]).map(function(x){return '<div class="item"><span class="ic">💛</span><span>'+x+'</span></div>';}).join("");
    var ax=$("rAxes");ax.innerHTML="";
    tags.forEach(function(x){var sp=document.createElement("span");sp.className="at";sp.textContent=x;ax.appendChild(sp);});
    var st=$("rStrength");st.innerHTML="";
    t.g.forEach(function(x){var sp=document.createElement("span");sp.className="tag";sp.textContent="#"+x;st.appendChild(sp);});
    show("result");
  }
  function doShare(){
    if(!current)return;
    var text="나의 머니 유형은 "+current.t.e+" "+current.t.n+"("+current.code+")! 너는 어떤 유형이야?";
    var url=location.href.split("#")[0];
    if(navigator.share){navigator.share({title:document.title,text:text,url:url}).catch(function(){});}
    else{doCopy(text+" "+url);}
  }
  function doCopy(c){var url=location.href.split("#")[0];var txt=c||url;function done(){var b=$("copyBtn");var o=b.textContent;b.textContent="✅ 복사 완료!";setTimeout(function(){b.textContent=o;},1500);}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(function(){window.prompt("아래 링크를 복사하세요",txt);});}else{window.prompt("아래 링크를 복사하세요",txt);}}
  function init(){$("startBtn").addEventListener("click",start);$("shareBtn").addEventListener("click",doShare);$("copyBtn").addEventListener("click",function(){doCopy();});$("restartBtn").addEventListener("click",function(){show("intro");});}
  if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init);}else{init();}
})();
</script>
</body>
</html>
