<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2B 마케팅 자가진단 · 1분 진단</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--blue:#3182f6;--blue-dark:#1b64da;--ink:#191f28;--gray:#8b95a1;--gray-light:#f2f4f6;--line:#e5e8eb;--bg:#f9fafb;--hot:#e0542a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;min-height:100vh;line-height:1.5;}
button{font-family:inherit;}
.app{width:100%;max-width:480px;background:#fff;min-height:100vh;overflow:hidden;}
.screen{display:none;padding:32px 24px 44px;}
.screen.active{display:block;animation:fade .4s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.intro{text-align:center;}
.intro.active{display:flex;flex-direction:column;justify-content:center;min-height:100vh;}
.badge{display:inline-block;background:#eef4ff;color:var(--blue);font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;margin:0 auto 22px;}
.intro .ic{font-size:60px;margin:6px 0 16px;}
.intro h1{font-size:29px;font-weight:800;line-height:1.32;letter-spacing:-.6px;word-break:keep-all;}
.intro p{color:var(--gray);font-size:16px;margin:16px 0 34px;word-break:keep-all;}
.btn{width:100%;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:17px;padding:17px;border-radius:14px;cursor:pointer;transition:.15s;letter-spacing:-.3px;}
.btn:active{transform:scale(.98);background:var(--blue-dark);}
.btn:disabled{background:#c5d2e6;cursor:not-allowed;}
.btn.ghost{background:var(--gray-light);color:var(--ink);}
.intro small{display:block;color:#b0b8c1;font-size:13px;margin-top:18px;}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:30px;}
.bar{flex:1;height:8px;background:var(--gray-light);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;width:14%;background:var(--blue);border-radius:99px;transition:width .35s ease;}
.qnum{font-size:13px;font-weight:700;color:var(--gray);white-space:nowrap;}
.qtext{font-size:23px;font-weight:800;line-height:1.4;letter-spacing:-.5px;margin-bottom:6px;word-break:keep-all;}
.qsub{font-size:14px;color:var(--gray);font-weight:500;margin-bottom:24px;}
.opts{display:flex;flex-direction:column;gap:11px;}
.opt{text-align:left;background:#fff;border:1.8px solid var(--line);border-radius:14px;padding:17px 18px;font-size:16px;font-weight:500;color:var(--ink);cursor:pointer;transition:.15s;word-break:keep-all;}
.opt:active{transform:scale(.985);}
.opt.on{border-color:var(--blue);background:#f5f8ff;color:var(--blue-dark);font-weight:700;}
.opt.on::after{content:" \2713";color:var(--blue);font-weight:800;}
.nextwrap{margin-top:18px;}
.result{text-align:left;}
.rcard{border-radius:22px;padding:28px 24px;color:#fff;margin-bottom:16px;background:linear-gradient(135deg,#4b8bf5,#1b64da);}
.rcard .rk{font-size:13px;font-weight:700;opacity:.92;letter-spacing:.3px;}
.rcard .rname{font-size:25px;font-weight:800;letter-spacing:-.5px;margin:7px 0 10px;}
.rcard .rsub{font-size:15px;opacity:.97;font-weight:500;line-height:1.65;word-break:keep-all;}
.sec{background:var(--bg);border-radius:16px;padding:20px;margin-bottom:14px;}
.sec h3{font-size:14px;font-weight:700;color:var(--gray);margin-bottom:12px;}
.sec .focus{font-size:18px;font-weight:800;color:var(--ink);line-height:1.5;letter-spacing:-.4px;word-break:keep-all;}
.fstep{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.fstep:last-of-type{border-bottom:none;}
.fstep .fn{flex:0 0 26px;height:26px;border-radius:8px;background:#e7eefc;color:var(--blue);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
.fstep .fct{font-size:15.5px;font-weight:800;color:var(--ink);}
.fstep .fcd{font-size:13.5px;color:#5c5280;line-height:1.55;margin-top:2px;word-break:keep-all;}
.fstep .fch{font-size:12px;color:var(--blue);font-weight:700;margin-top:5px;}
.fstep.hot{background:#fff4ef;border:1.5px solid #f6d4c5;border-radius:12px;padding:14px;border-bottom:1.5px solid #f6d4c5;margin:6px 0;}
.fstep.hot .fn{background:#ffe0d4;color:var(--hot);}
.fstep.hot .fct .hb{font-size:11px;font-weight:800;color:#fff;background:var(--hot);padding:2px 8px;border-radius:10px;margin-left:7px;vertical-align:middle;}
.fstep.hot .fch{color:var(--hot);}
.role{font-size:13.5px;color:#3a4150;line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);word-break:keep-all;}
.role b{color:var(--blue-dark);}
.bench{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px;}
.bench .bl{font-size:12.5px;font-weight:800;color:var(--blue);letter-spacing:.3px;margin-bottom:6px;}
.bench .bt{font-size:15px;color:#3a4150;line-height:1.6;word-break:keep-all;}
.bench .bt b{color:var(--ink);font-weight:800;}
.bigest{background:#eef4ff;border-radius:12px;padding:14px 16px;text-align:center;margin-bottom:11px;}
.bigest .e1{font-size:13px;font-weight:700;color:#5a6b8c;}
.bigest .e2{font-size:24px;font-weight:900;color:var(--blue-dark);letter-spacing:-.5px;margin:3px 0;}
.bigest .e3{font-size:12px;color:#8b95a1;}
.primary{background:#fff;border:1.8px solid #cfe0fb;border-radius:14px;padding:17px;margin-bottom:6px;}
.primary .pq{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.5px;margin-bottom:5px;}
.primary .pc{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.3px;}
.cm{font-size:12.5px;color:var(--gray);font-weight:600;}
.stp{display:flex;gap:10px;margin-bottom:8px;}.stp:last-child{margin-bottom:0;}
.stp .sn{flex:0 0 22px;height:22px;border-radius:7px;background:#eef4ff;color:var(--blue);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.stp .sx{font-size:14px;color:#3a4150;line-height:1.5;word-break:keep-all;}
.stp .sx b{color:var(--ink);font-weight:700;}
.intro2{font-size:15px;color:#3a4150;line-height:1.72;margin-bottom:14px;word-break:keep-all;}
.intro2 b{color:var(--blue-dark);}
.grouplab{font-size:13px;font-weight:700;color:var(--gray);margin:14px 0 8px;}
.nextlist .ni{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.nextlist .ni:last-child{border-bottom:none;}
.nextlist .nn{flex:0 0 22px;height:22px;border-radius:7px;background:#eef4ff;color:var(--blue);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.nextlist .nt{font-size:14.5px;font-weight:700;color:var(--ink);}
.nextlist .nm{font-size:12.5px;color:var(--gray);margin-top:1px;}
.tags{display:flex;gap:8px;flex-wrap:wrap;}
.tag{background:#eef4ff;color:#1b64da;font-size:14px;font-weight:700;padding:7px 13px;border-radius:99px;}
.bktag{background:#fff;border:1.5px solid var(--line);color:#4a5160;font-size:14px;font-weight:700;padding:7px 13px;border-radius:99px;}
.notetext{font-size:13px;color:var(--gray);line-height:1.6;word-break:keep-all;}
.trap{background:#fff7f3;border:1px solid #f3ddcf;border-radius:14px;padding:15px 17px;font-size:14px;color:#7a4a30;line-height:1.65;margin-bottom:14px;word-break:keep-all;}
.trap b{color:#c2401c;}
.tnote{background:#f0f6ff;border:1px solid #d3e3fb;border-radius:14px;padding:14px 16px;font-size:14px;color:#33507e;line-height:1.65;margin-bottom:14px;word-break:keep-all;}
.tnote b{color:var(--blue-dark);}
.gloss{background:#f7f8fa;border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:12.5px;color:#6b7684;line-height:1.7;margin-bottom:14px;word-break:keep-all;}
.gloss b{color:#3a4150;}
.disclaimer{font-size:11.5px;color:#b0b8c1;margin-top:18px;line-height:1.55;word-break:keep-all;text-align:center;}
.rcard .rname{font-size:23px;font-weight:800;letter-spacing:-.5px;margin:6px 0 9px;}
.fstep .fmap{font-size:12.5px;font-weight:700;margin-top:5px;}
.fstep .fmap .ok{color:#1c7a4a;}.fstep .fmap .gap{color:#c2401c;}.fstep .fmap .sales{color:#9aa3b8;}
.weak{background:#fff7f3;border:1px solid #f3ddcf;border-radius:14px;padding:15px 17px;margin-bottom:14px;font-size:14px;color:#7a4a30;line-height:1.66;word-break:keep-all;}
.weak .wh{font-weight:800;color:#c2401c;margin-bottom:5px;font-size:14.5px;}
.addcard{background:#fff;border:1.6px solid #cfe0fb;border-radius:13px;padding:14px 15px;margin-bottom:10px;}
.addh{font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.3px;}
.addn{width:22px;height:22px;border-radius:7px;background:#eef4ff;color:var(--blue);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.atag{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:8px;}
.atag.keep{background:#e6f5ec;color:#1c7a4a;}.atag.add{background:#eef4ff;color:#1b64da;}
.addwhy{font-size:13.5px;color:#3a4150;margin-top:6px;line-height:1.6;word-break:keep-all;}
.estimate{font-size:12px;font-weight:700;color:#1b64da;background:#eef4ff;border-radius:9px;padding:7px 10px;margin-top:8px;}
.estimate .estsub{font-weight:500;color:#8b95a1;}
.psteps{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;}
.pstp{display:flex;gap:9px;margin-bottom:6px;}.pstp:last-child{margin-bottom:0;}
.pstp span{flex:0 0 19px;height:19px;border-radius:6px;background:#f2f4f6;color:#6b7684;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.pstp .pd{font-size:13px;color:#4a5160;line-height:1.5;word-break:keep-all;}.pstp .pd b{color:var(--ink);}
.mods{list-style:none;margin-top:10px;}.mods li{font-size:13px;color:#55607a;padding:6px 0 6px 16px;position:relative;line-height:1.55;word-break:keep-all;}
.mods li::before{content:"\203A";position:absolute;left:3px;color:var(--blue);font-weight:800;}
.talk{font-size:14.5px;line-height:1.74;color:#3a4150;word-break:keep-all;margin-bottom:12px;}
.talk b{color:#11161f;font-weight:800;}
.talk i{color:#1c7a4a;font-style:normal;font-weight:700;font-size:12.5px;}
.sec.problem{background:#fff6f1;border:1px solid #f6ddd0;}
.sec.problem h3{color:#c2401c;}
.sec.fix{background:#f1faf4;border:1px solid #d4eede;}
.sec.fix h3{color:#1c7a4a;}
.fstep .fct{font-size:14.5px;}
</style>
</head>
<body>
<div class="app">
  <section class="screen intro active" id="intro">
    <span class="badge">B2B 마케팅 · 1분 자가진단</span>
    <div class="ic">🧭</div>
    <h1>광고는 하는데 문의가<br>안 온다면, 어디가 막혔을까?</h1>

    <button class="btn" id="startBtn">진단 시작하기 →</button>

    <div class="nextwrap" id="nextwrap" style="display:none;"><button class="btn" id="nextBtn">결과 보기 →</button></div>
  </section>
  <section class="screen result" id="result"></section>
</div>

 $("qtext").textContent=it.q;$("qsub").textContent=it.sub||"";$("qsub").style.display=it.sub?"block":"none";
 $("qnum").textContent=(idx+1)+" / "+FLOW.length;$("barFill").style.width=((idx+1)/FLOW.length*100)+"%";
 var box=$("opts");box.innerHTML="";
 it.opts.forEach(function(o){
   var b=document.createElement("button");b.className="opt";b.textContent=o[0];
   if(it.kind==="multi"&&A.channels.indexOf(o[1])>=0)b.className="opt on";
   b.addEventListener("click",function(){
     if(it.kind==="single"){A[it.key]=o[1];idx++;(idx<FLOW.length)?render():finish();}
     else{if(o[1]==="none"){A.channels=(A.channels.indexOf("none")>=0)?[]:["none"];}else{A.channels=A.channels.filter(function(x){return x!=="none";});var p=A.channels.indexOf(o[1]);p>=0?A.channels.splice(p,1):A.channels.push(o[1]);}render();}
   });
   box.appendChild(b);
 });
 var nw=$("nextwrap");
 if(it.kind==="multi"){nw.style.display="block";$("nextBtn").disabled=A.channels.length===0;}else nw.style.display="none";
}
function score(){
 var s={};for(var k in CHANNELS)s[k]=0;
 SUBTYPES[A.sub].channels.forEach(function(id,i){s[id]+=(5-i);});
 BOTTLE[A.bottle].channels.forEach(function(id){if(s[id]!=null)s[id]+=4;});
 var low=(A.budget==="b1"||A.budget==="b2");
 for(var c in CHANNELS){var ch=CHANNELS[c];
   if(low){if(ch.organic)s[c]+=2;if(ch.cost==="high")s[c]-=4;}
   if(A.budget==="b4"&&!ch.organic)s[c]+=1;
   if(A.stage==="validate"&&ch.organic)s[c]+=1;
   if(A.stage==="stable"&&(c==="email"||c==="seo"))s[c]+=2;}
 if(A.deal==="high"){s.outbound+=3;s.webinar+=3;s.linkedin+=2;s.email+=2;s.site+=1;}
 if(A.deal==="low"){s.search+=2;s.seo+=2;s.site+=2;s.meta+=2;}
 if(A.team==="ceo"||A.team==="solo"){s.webinar-=2;s.expo-=2;s.linkedin-=1;}
 return s;
}
function fmt(n){return Math.round(n).toLocaleString();}
function finish(){
 var st=SUBTYPES[A.sub], bt=BOTTLE[A.bottle], cell=GRID[A.sub][A.bottle];
 var cur=[];A.channels.forEach(function(g){if(GROUPS[g])cur=cur.concat(GROUPS[g]);});
 function covers(stage){return cur.filter(function(c){return (CH_STAGE[c]||[]).indexOf(stage)>=0;});}
 function cn(c){return CHANNELS[c].name.replace(/\(.*\)/,"").trim();}
 var isDiff=(A.bottle==="diff");
 var botCov=isDiff?cell.add.some(function(a){return cur.indexOf(a[0])>=0;}):(covers(A.bottle).length>0);
 var stageName="";st.flow.forEach(function(f){if(f.b===A.bottle)stageName=f.t;});
 var sn=isDiff?"차별화":stageName;
 var NM={mfg:"제조·부품 B2B",saas:"IT·SaaS B2B",constr:"건설·부동산 B2B",pro:"전문서비스 B2B"}[A.sub];
 var TEAM2={ceo:"대표님이 직접 챙기시는",solo:"직원 한 분이 겸업으로 도맡는",team:"마케팅 팀을 두고 운영하시는",agency:"외주 대행에 맡기시는"};
 var GLAB={g_search:"검색·광고",g_content:"콘텐츠·SEO",g_direct:"세미나·전시·영업"};
 var curLabel=(cur.length?A.channels.filter(function(g){return g!=="none";}).map(function(g){return GLAB[g];}).join(", "):"");
 var flowNames=st.flow.map(function(f){return f.t;});
 var coveredNames=[],gapNames=[],rows="";
 st.flow.forEach(function(f,i){
   var ch=covers(f.b), hot=(!isDiff&&f.b===A.bottle), stat;
   if(ch.length){coveredNames.push(f.t);stat='<span class="ok">✅ '+ch.map(cn).join(", ")+'</span>';}
   else if(f.b==="convert"&&!hot){stat='<span class="sales">영업 담당</span>';}
   else {gapNames.push(f.t);stat='<span class="gap">⚠️ 비어 있음</span>';}
   rows+='<div class="fstep'+(hot?" hot":"")+'"><div class="fn">'+(i+1)+'</div><div style="flex:1"><div class="fct">'+f.t+(hot?'<span class="hb">막힌 곳</span>':'')+'</div><div class="fmap">'+stat+'</div></div></div>';
 });
 var h="";
 h+='<div class="rcard"><div class="rk">1분 진단 결과</div><div class="rname">'+NM+'</div><div class="rsub">막힌 곳 · '+sn+'</div></div>';
 var sit='<b>'+NM+'</b>이고, '+BUDLAB[A.budget]+' 예산을 '+TEAM2[A.team]+' 상황이에요. ';
 var cov;
 if(!cur.length)cov='아직 이렇다 할 마케팅 채널이 없어서, 사실상 '+flowNames.join(' → ')+' 전 단계가 다 열려 있는 셈이에요.';
 else if(coveredNames.length&&gapNames.length)cov='지금 쓰시는 <b>'+curLabel+'</b>로 '+coveredNames.join('·')+'까지는 닿는데, <b>'+gapNames.join('·')+'</b> 단계가 비어 있어요.';
 else if(coveredNames.length)cov='지금 쓰시는 <b>'+curLabel+'</b>로 주요 단계는 대체로 커버하고 계세요.';
 else cov='지금 쓰시는 <b>'+curLabel+'</b>로는 핵심 단계가 아직 비어 있어요.';
 h+='<div class="sec"><h3>📍 지금 상황은</h3><div class="talk">'+sit+cov+'</div>'+rows+'</div>';
 var weak;
 if(isDiff)weak='<b>지금 진짜 문제는 ‘차별화’예요.</b> '+cell.gap;
 else if(botCov)weak='<b>지금 진짜 문제는 ‘'+sn+'’ 단계예요.</b> 채널은 있는데 막혀 있어요. '+cell.gap;
 else weak='<b>지금 진짜 문제는 ‘'+sn+'’ 단계예요.</b> 여기가 비어 있다 보니 — '+cell.gap;
 h+='<div class="sec problem"><h3>🔴 지금 진짜 문제</h3><div class="talk">'+weak+'</div></div>';
 var lead=botCov?'채널을 더 벌이기보다, 지금 쓰는 걸 제대로 손보는 게 먼저예요. 순서는 이래요.':'여러 개 벌이지 말고, 이 빈 곳부터 딱 하나만 메우면 돼요. 순서는 이래요.';
 h+='<div class="sec fix"><h3>🟢 그래서, 이렇게 풀어요</h3><div class="talk">'+lead+'</div>';
 h+=cell.add.map(function(a,i){
   var c=a[0],why=a[1],pc=CHANNELS[c],used=cur.indexOf(c)>=0;
   var frameLab=(i===0)?'가장 먼저':'이게 자리 잡으면';
   var est="";
   if(pc.cpl){var mid=BUDMID[A.budget],lo=Math.max(1,Math.floor(mid/pc.cpl[1])),hi=Math.ceil(mid/pc.cpl[0]);est='<div class="estimate">'+BUDLAB[A.budget]+'이면 대략 <b>월 '+lo+'~'+hi+'건</b> 문의를 기대해볼 수 있어요. <span class="estsub">(CPL '+pc.cpl[0]+'~'+pc.cpl[1]+'만 가정·참고치)</span></div>';}
   var steps=(i===0)?('<div class="psteps">'+pc.steps.map(function(s,j){return '<div class="pstp"><span>'+(j+1)+'</span><div class="pd"><b>'+s[0]+'</b> — '+s[1]+'</div></div>';}).join("")+'</div>'):'';
   return '<div class="addcard"><div class="addh"><span class="atag '+(used?"keep":"add")+'">'+frameLab+'</span>'+pc.name+'</div><div class="addwhy">'+why+(used?' <i>(이미 쓰고 계시니 강화)</i>':'')+'</div>'+est+steps+'</div>';
 }).join("");
 var tips=[];
 if(A.deal==="high")tips.push("객단가가 높으니 영업·세미나 같은 직접 채널 비중도 같이 키우면 좋아요.");
 if(A.deal==="low")tips.push("객단가가 낮으니 손 덜 가는 검색·콘텐츠로 자동 유입을 만드는 게 유리해요.");
 if(A.team==="ceo"||A.team==="solo")tips.push("지금은 "+(A.team==="ceo"?"대표님이 직접":"혼자 겸업으로")+" 하시니, 채널을 늘리기보다 위 한두 개에 집중하세요.");
 if(A.team==="agency")tips.push("대행에 맡기더라도 핵심 채널 하나는 직접 들여다봐야 노하우가 남아요.");
 if(A.stage==="validate")tips.push("아직 검증 단계니 돈 드는 광고 전에 오가닉(검색·콘텐츠)으로 작게 시작하세요.");
 if(A.stage==="stable")tips.push("안정 단계니 신규 유입보다 전환·재구매 효율을 끌어올리는 데 집중하세요.");
 if(tips.length)h+='<ul class="mods">'+tips.map(function(t){return '<li>'+t+'</li>';}).join("")+'</ul>';
 h+='</div>';
 h+='<button class="btn ghost" id="againBtn">다시 진단하기</button>';
 h+='<p class="disclaimer">정밀 감사가 아니라 ‘방향 잡기’예요. 추정 수치는 업종·소재·시즌에 따라 달라지는 참고치입니다.</p>';
 $("result").innerHTML=h;
 $("againBtn").addEventListener("click",function(){show("intro");});
 show("result");
}
$("startBtn").addEventListener("click",start);
$("nextBtn").addEventListener("click",function(){if(A.channels.length)finish();});
})();
</script>
</body>
